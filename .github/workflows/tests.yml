name: Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: macos-26  # macOS Tahoe - matches development environment

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
        env:
          CI: true

      - name: Build
        run: swift build -v
        env:
          CI: true

      - name: Run tests
        run: swift test -v --disable-swift-testing
        env:
          CI: true
